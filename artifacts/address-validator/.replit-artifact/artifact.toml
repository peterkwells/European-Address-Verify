kind = "web"
previewPath = "/"
title = "European Address Validator"
version = "1.0.0"
id = "artifacts/address-validator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21731

[services.development]
run = "pnpm --filter @workspace/address-validator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/address-validator", "run", "build" ]
publicDir = "artifacts/address-validator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21731"
BASE_PATH = "/"
